<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2C7A" />
      <stop offset="50%" stop-color="#071E56" />
      <stop offset="100%" stop-color="#041238" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Stitch Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-dasharray="14 10" opacity="0.85"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- Inner Badge Container -->
  <circle cx="256" cy="256" r="170" fill="#092261" filter="url(#shadow)" stroke="#1E40AF" stroke-width="3"/>

  <!-- Sewing Needle & Thread Motifs -->
  <!-- Golden Thread Loop -->
  <path d="M156,230 C156,160 256,150 256,220 C256,290 356,280 356,210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 0" filter="url(#shadow)"/>
  
  <!-- Stylized Needle -->
  <g transform="rotate(-35 256 240)">
    <path d="M252,90 L260,90 L259,310 L256,360 L253,310 Z" fill="#E2E8F0"/>
    <ellipse cx="256" cy="120" rx="2.5" ry="12" fill="#0B2C7A"/>
  </g>

  <!-- Center 'T' Monogram & Fabric Shears Symbolism -->
  <g transform="translate(0, 5)">
    <!-- Main Lettering TEWAW -->
    <text x="256" y="325" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="52" 
          letter-spacing="5" 
          fill="#FFFFFF" 
          filter="url(#shadow)">
      TEWAW
    </text>
    
    <!-- Subtitle: KENYA -->
    <text x="256" y="360" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="16" 
          letter-spacing="8" 
          fill="#34D399">
      GARMENTS • KENYA
    </text>
  </g>
  
  <!-- Kenyan Flag Accent Strip in corner -->
  <g transform="translate(360, 48) scale(0.65)">
    <rect x="0" y="0" width="80" height="16" fill="#000000" rx="3" />
    <rect x="0" y="16" width="80" height="4" fill="#FFFFFF" />
    <rect x="0" y="20" width="80" height="16" fill="#BB0000" />
    <rect x="0" y="36" width="80" height="4" fill="#FFFFFF" />
    <rect x="0" y="40" width="80" height="16" fill="#006600" rx="3" />
  </g>
</svg>
